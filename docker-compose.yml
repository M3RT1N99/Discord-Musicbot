services:
  musicbot:
    build:
      context: .
      dockerfile: dockerfile
    container_name: discord-musicbot
    restart: unless-stopped

    environment:
      # Discord Bot Configuration
      - TOKEN=${TOKEN}

      # yt-dlp Configuration (fixed in Docker container)
      - YTDLP_PATH=/opt/venv/bin/yt-dlp
      - DOWNLOAD_DIR=/app/downloads
      - MAPPING_DIR=/mapping/christ

      # User-configurable settings from .env
      - MAX_CACHE=${MAX_CACHE:-200}
      - DOWNLOAD_TIMEOUT_SEC=${DOWNLOAD_TIMEOUT_SEC:-120}
      - SEARCH_TIMEOUT_SEC=${SEARCH_TIMEOUT_SEC:-30}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=${LOG_DIR:-/tmp} # Set to /tmp for maximum stability (no host I/O)
      - NODE_ENV=${NODE_ENV:-production}

    volumes:
      # Downloads directory - bind mount to host path from .env
      - ${DOWNLOAD_HOST_PATH:-./downloads}:/app/downloads

      # Local audio files for /playchrist
      - ${MAPPING_HOST_PATH:-./mapping/christ}:/mapping/christ:ro

      # Logs directory (optional: can also be bind mount)
      - ${LOGS_HOST_PATH:-./logs}:/app/logs
      # Optional: Mount source code for development
      # - ./src:/app/src:ro

    networks:
      - musicbot-network

    # Der Container läuft als uid 99 / gid 100 (musicbot). Die Musik-Bibliothek
    # für /playchrist gehört auf dem Host 1000:1000 mit Gruppenrechten 750/640 —
    # die Zusatz-Gruppe erlaubt Lesen, ohne die Host-Dateien anzufassen.
    group_add:
      - "1000"

    # Allow setting process priorities for audio threads
    cap_add:
      - SYS_NICE

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

    healthcheck:
      # Datei-Kontrakt: der Bot schreibt alle 30s einen Heartbeat-Timestamp
      # nach /tmp/bot_heartbeat. Healthy = Datei existiert und mtime < 90s.
      # ($$ = escaped $ für Compose-Interpolation)
      test: [ "CMD-SHELL", "test -f /tmp/bot_heartbeat && [ $$(($$(date +%s) - $$(stat -c %Y /tmp/bot_heartbeat))) -lt 90 ] || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 3
      # Start dauert bis zu ~60s (pip-Update), erster Heartbeat danach binnen 30s
      start_period: 120s

networks:
  musicbot-network:
    driver: bridge
